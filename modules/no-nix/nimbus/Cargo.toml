[package]
name = "nimbus"
version = "0.1.0"
edition = "2024"
description = "A glassy, spring-animated top bar for niri"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
calloop = "0.14"
calloop-wayland-source = "0.4.1"
glyphon = "0.12.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
libc = "0.2"
niri-ipc = "26.4.0"
pollster = "0.4"
raw-window-handle = "0.6"
resvg = { version = "0.49.0", default-features = false }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["xkbcommon", "calloop"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["staging", "unstable", "client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Vulkan only: no GL/EGL loader, smaller binary, faster init.
wgpu = { version = "30.0.1", default-features = false, features = ["vulkan", "wgsl", "std"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
